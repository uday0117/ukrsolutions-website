  <style>
    html, body {
      background: #020617;
      margin: 0;
      padding: 0;
      color-scheme: dark;
    }

    /* SEO content: hidden visually, available to crawlers */
    #seo-content {
      position: absolute;
      left: -10000px;
      top: auto;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip-path: inset(50%);
      white-space: nowrap;
      border: 0;
    }

    /* Dark splash — matches Flutter theme, no white flash */
    #app-loader {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: radial-gradient(ellipse at 30% 20%, rgba(99,102,241,0.18) 0%, transparent 50%),
                  radial-gradient(ellipse at 70% 80%, rgba(6,182,212,0.12) 0%, transparent 50%),
                  #020617;
      z-index: 9999;
      transition: opacity 0.5s ease, visibility 0.5s ease;
    }

    #app-loader.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .loader-logo {
      width: 72px;
      height: 72px;
      border-radius: 18px;
      background: linear-gradient(135deg, #3B82F6, #10B981);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 36px;
      font-weight: 800;
      color: white;
      font-family: system-ui, sans-serif;
      box-shadow: 0 0 40px rgba(59,130,246,0.35);
      animation: pulse 2s ease-in-out infinite;
    }

    .loader-text {
      margin-top: 20px;
      font-family: system-ui, sans-serif;
      font-size: 14px;
      color: #64748B;
      letter-spacing: 0.5px;
    }

    .loader-bar {
      margin-top: 24px;
      width: 120px;
      height: 3px;
      background: rgba(255,255,255,0.08);
      border-radius: 999px;
      overflow: hidden;
    }

    .loader-bar::after {
      content: '';
      display: block;
      height: 100%;
      width: 40%;
      background: linear-gradient(90deg, #3B82F6, #06B6D4);
      border-radius: 999px;
      animation: slide 1.2s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.04); }
    }

    @keyframes slide {
      0% { transform: translateX(-100%); }
      100% { transform: translateX(350%); }
    }

    /* Hide empty AdSense placeholders (white boxes before fill or when unfilled) */
    ins.adsbygoogle[data-ad-status="unfilled"],
    ins.adsbygoogle:not([data-ad-status="filled"]) {
      display: none !important;
    }

    iframe[id^="google_ads_iframe"],
    iframe[src*="googlesyndication"] {
      background: transparent !important;
    }
  </style>
</head>

<body>
  <div id="app-loader" aria-hidden="true">

    </p>

  <script src="flutter_bootstrap.js" async></script>

  <script>
    (function () {
      // Keep false until AdSense review is approved — prevents white ad boxes
      // and policy hits while the account is still flagged.
      var ADS_ENABLED = false;
      var AD_CLIENT = 'ca-pub-1451522103593938';

      function currentPath() {
        return window.location.pathname.replace(/\/$/, '') || '/';
      }

      function pathAllowed(p) {
        if (p === '/' || p === '/apps' || p === '/about') return true;
        if (p === '/blog' || p.indexOf('/blog/') === 0) return true;
        return false;
      }

      function hideLoader() {
        var loader = document.getElementById('app-loader');
        if (loader) loader.classList.add('hidden');
      }

      function loadAdSense() {
        if (!ADS_ENABLED) return;
        if (!pathAllowed(currentPath())) return;
        if (document.querySelector('script[src*="adsbygoogle.js"]')) return;
        var s = document.createElement('script');
        s.async = true;
        s.crossOrigin = 'anonymous';
        s.src = 'https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=' + AD_CLIENT;
        document.head.appendChild(s);
      }

      window.updateAdPolicy = function (path) {
        var p = (path || window.location.pathname).replace(/\/$/, '') || '/';
        var allowed = pathAllowed(p);
        document.querySelectorAll('ins.adsbygoogle, iframe[id^="google_ads"], iframe[src*="googlesyndication"]').forEach(function (el) {
          el.style.display = allowed ? '' : 'none';
        });
        if (allowed) loadAdSense();
      };

      window.addEventListener('flutter-first-frame', function () {
        hideLoader();
        setTimeout(loadAdSense, 1500);
      });
    })();
  </script>
</body>
